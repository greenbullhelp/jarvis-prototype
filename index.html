<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0f">
  <title>Джарвіс — прототип</title>
  <link rel="stylesheet" href="css/tokens.css?v=4">
  <link rel="stylesheet" href="css/app.css?v=4">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><i aria-hidden="true"></i><b>Джарвіс</b><span>прототип · демо-дані</span></div>
      <div class="top-right">
        <span class="chip hide-s" id="chip-state">Стан: <b>спокій</b></span>
        <button class="stop" id="stop" type="button" aria-label="Зупинити всіх агентів">СТОП</button>
      </div>
    </header>

    <aside class="panel left" aria-label="Задачі">
      <h2><span>Задачі Джарвіса</span><span id="tasks-count"></span></h2>
      <div id="tasks"></div>
    </aside>

    <main class="stage-wrap">
      <svg id="stage" data-state="idle" role="img" aria-label="Ядро Джарвіса та агенти"></svg>
      <p class="reply" id="reply" aria-live="polite"></p>
    </main>

    <aside class="panel right" aria-label="Витрати">
      <h2>Токени сьогодні</h2>
      <div class="card gold">
        <div class="big" id="spent">$0.00</div>
        <div class="meter"><i id="meter"></i></div>
        <div class="kv">
          <span>Денний ліміт</span><b id="limit"></b>
          <span>Залишок</span><b id="left"></b>
          <span>Токени (вхід / вихід)</span><b id="tokens"></b>
        </div>
      </div>
      <h2>Вартість за агентами</h2>
      <div class="card"><div class="agent-cost" id="costs"></div></div>
      <p class="empty">Прототип на демо-даних: без ключів і без сервера.
        Дизайн на основі <a href="https://github.com/RubenM1990/APEX-UI" style="color:var(--c-text-2)">APEX-UI</a> (MIT) — див. CREDITS.md.</p>
    </aside>

    <form class="bar-bottom" id="form" autocomplete="off">
      <button class="mic" id="mic" type="button" aria-label="Голосовий ввід" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      </button>
      <label class="field"><span class="sr">Повідомлення Джарвісу</span>
        <input id="input" type="text" placeholder="Напишіть або скажіть Джарвісу…" enterkeyhint="send">
        <button class="send" id="send" type="submit" aria-label="Надіслати" disabled>↑</button>
      </label>
    </form>
  </div>

  <div class="agent-card" id="card" role="dialog" aria-modal="false" hidden></div>

  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
